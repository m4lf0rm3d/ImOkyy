 let h=n?`<div class="glass note">Record a best time first — your tables are built from it.<br><button class="pri sm" data-a="tab" data-v="best">Go to Best Time</button></div>`:'';
 h+=`<div class="ring glass"><svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="90"/><circle id="rg" cx="100" cy="100" r="90" transform="rotate(-90 100 100)"/></svg><div class="ctr"><div id="lb"></div><div id="tm"></div><div id="sb"></div></div></div>`;
 h+=`<div class="ctl"><button class="rb" id="bk" data-a="back" aria-label="Backward">${I.minus}<small>${g.back}s</small></button><button class="mb" id="mb" data-a="main" aria-label="Start or pause"></button><button class="rb" id="fw" data-a="fwd" aria-label="Forward">${I.plus}<small>${g.fwd}s</small></button></div>`;
 h+=`<div class="ctl2"><button class="pill" id="st" data-a="stop">${I.stop} Stop</button><button class="pill" id="sk" data-a="skip" hidden>${I.skip} End hold early</button></div>`;
 if((k==='co2'||k==='o2')&&!n){const c=S.set[k];h+=`<div class="glass plan"><div class="ph">Hold target ${c.pct}% of ${fmt(pb())} · gap ${c.gap}s</div>${plan(k).map((r,i)=>`<div class="pr${i===7?' last':''}"><b>${i+1}</b><span>Hold ${fmt(r.h)}</span>${i===7?'':`<span>Breathe ${fmt(r.b)}</span>`}</div>`).join('')}</div>`}
 return h}
function hist(k){const a=S.h[k].slice().reverse(),dt=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
 if(!a.length)return`<div class="glass empty">No history yet. Finish a session and choose Save.</div>`;
 if(k==='best')return`<div class="glass tbl"><div class="ph">Personal best ${fmt(pb())}</div><table><tr><th>Date</th><th>Hold</th></tr>${a.map(e=>`<tr><td>${dt(e.ts)}</td><td>${fmt(e.s)}</td></tr>`).join('')}</table></div>`;
 return`<div class="glass tbl"><table><tr><th>Date</th><th>Best</th><th>%</th><th>Gap</th><th>Holds</th></tr>${a.map(e=>`<tr><td>${dt(e.ts)}</td><td>${fmt(e.pb)}</td><td>${e.pct}</td><td>${e.gap}s</td><td>${e.n}/8${e.n===8?' ✓':''}</td></tr>`).join('')}</table></div>`}
function render(){const T={co2:'CO₂ Table',o2:'O₂ Table',best:'Best Time',box:'Box Breathing'}[tab];
 let h=`<div class="row"><h2>${T}</h2></div>`;
 if(tab!=='box')h+=`<div class="seg glass">${[['train','Train',I.play],['history','History',I.hist]].map(x=>`<button data-a="sub" data-v="${x[0]}" class="${sub===x[0]?'on':''}">${x[2]}${x[1]}</button>`).join('')}</div>`;
 const hs=tab!=='box'&&sub==='history';h+=hs?hist(tab):train(tab);$('#mn').innerHTML=h;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));if(!hs)idle()}
/* settings */
const fld=(p,l,a,b)=>{const[s,k]=p.split('.');return`<label>${l}<input type="number" inputmode="numeric" min="${a}" max="${b}" data-p="${p}" value="${S.set[s][k]}"></label>`},
chk=(p,l)=>{const[s,k]=p.split('.');return`<label class="ck"><input type="checkbox" data-p="${p}"${S.set[s][k]?' checked':''}>${l}</label>`};
const saveBtns='<div class="bt"><button class="pri" data-a="ss">Save</button><button data-a="close">Cancel</button></div>';
function settings(){modal(`<h3>Settings</h3>
 <section class="set-section"><h4 class="set-title">CO₂ Table</h4>${fld('co2.gap','Gap between cycles (seconds, 1–60)',1,60)}${fld('co2.pct','Percent of best time (1–100)',1,100)}</section>
 <section class="set-section"><h4 class="set-title">O₂ Table</h4>${fld('o2.gap','Gap between cycles (seconds, 1–60)',1,60)}${fld('o2.pct','Percent of best time (1–100)',1,100)}</section>
 <section class="set-section"><h4 class="set-title">Box Breathing</h4>${fld('box.t','Seconds per phase (inhale / hold / exhale / hold)',1,60)}</section>
 <section class="set-section"><h4 class="set-title">General</h4>${fld('g.prep','Prepare time (seconds)',1,120)}${fld('g.fwd','Forward button adds (seconds)',1,60)}${fld('g.back','Backward button subtracts (seconds)',1,60)}${chk('g.snd','Sound cues')}${chk('g.vib','Vibration')}</section>
 <div class="bt wrap"><button data-a="exp">${I.dl} Export JSON</button><label class="btn">${I.up} Import JSON<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="warn" data-a="clr">Clear history</button><button class="warn" data-a="rst">Reset settings</button></div>`+saveBtns,true)}
function saveSet(){document.querySelectorAll('#md input[data-p]').forEach(i=>{const[s,k]=i.dataset.p.split('.');if(i.type==='checkbox')S.set[s][k]=i.checked;else{const[a,b]=LIM[s][k];let v=Math.round(+i.value);if(!fin(v)||i.value==='')v=D[s][k];S.set[s][k]=Math.min(b,Math.max(a,v))}});save();close();render()}
async function exp(){try{const dl=await claude.use('downloads');if(!dl)return toast('Export isn’t available in this view');
 await dl.save({filename:'abyssal-'+new Date().toISOString().slice(0,10)+'.json',data:new Blob([JSON.stringify({app:'abyssal',v:1,set:S.set,h:S.h},null,2)],{type:'application/json'})})}catch(e){if(!e||e.code!=='declined')toast('Export isn’t available in this view')}}
document.addEventListener('change',async e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;
 try{const o=JSON.parse(await f.text());if(!o||typeof o.set!=='object'||typeof o.h!=='object')throw 0;ask('Replace all current data with this file?',()=>{S=fresh();merge(o);S.ok=1;save();close();render();toast('Imported')})}catch(x){toast('That isn’t a valid ImOkyy backup')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.classList.contains('dis'))return;const v=b.dataset.v,busy=()=>E.on&&(toast('Stop the session first'),1);
 switch(b.dataset.a){
 case'tab':if(busy())return;tab=v;sub='train';render();break;
 case'sub':if(busy())return;sub=v;render();break;
 case'gen':if(busy())return;settings();break;
 case'main':main();break;case'stop':stop();break;case'back':adj(-S.set.g.back);break;case'fwd':adj(S.set.g.fwd);break;case'skip':if(!E.paused)next(1);break;
 case'close':close();break;case'ss':saveSet();break;case'svr':saveRes();break;case'dsc':close();reset();break;case'res':close();resume();ui();draw();break;
 case'exp':exp();break;
 case'clr':ask('Clear all CO₂, O₂ and best-time history? Your settings stay as they are.',()=>{S.h={co2:[],o2:[],best:[]};save();close();render();toast('History cleared')});break;
 case'rst':ask('Reset all settings to their defaults?',()=>{S.set=cl(D);save();close();render()});break;
 case'yes':{const f=E.yes;E.yes=null;f&&f()}break;
 case'ok':S.ok=1;save();close();break}});
/* init */
load();
$('#gen').innerHTML=I.gear;
$('nav').innerHTML=[['co2','CO₂'],['o2','O₂'],['best','Best'],['box','Box']].map(x=>`<button data-a="tab" data-v="${x[0]}">${I[x[0]]}${x[1]}</button>`).join('');
for(let i=0;i<9;i++){const b=document.createElement('span'),s=6+Math.random()*16;b.className='bub';b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;document.body.appendChild(b)}
if(BG){const i=$('#bgi');i.style.backgroundImage=`url(${BG})`;i.style.opacity=.7}
render();
if(!S.ok)modal('<h3>Before you start</h3><p>Dry-land training only. Never practise breath-holds in or near water, never train alone, and never hyperventilate beforehand.</p><div class="bt"><button class="pri" data-a="ok">I understand</button></div>');
setInterval(tick,100);
</script>
